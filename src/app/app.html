<header class="header">
  <div class="container">
    <div class="logo">DigiSpots</div>
    
    <!-- Mobile Menu Button -->
    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation -->
    <nav class="nav" [class.menu-open]="isMenuOpen()">
      <a routerLink="/" class="nav-link" routerLinkActive="active" (click)="closeMenu()">Home</a>
      <a routerLink="/locations" class="nav-link" routerLinkActive="active" (click)="closeMenu()">Locations</a>
      <a routerLink="/pricing" class="nav-link" routerLinkActive="active" (click)="closeMenu()">Pricing</a>
      <a routerLink="/my-bookings" class="nav-link" routerLinkActive="active" *ngIf="currentUser" (click)="closeMenu()">Meine Buchungen</a>
      
      <!-- Logout button in burger menu (mobile/tablet only) -->
      <button *ngIf="currentUser" class="btn btn-logout-mobile" (click)="logout(); closeMenu()">
        Logout
      </button>
    </nav>
    <div class="auth-buttons">
      <button class="cart-btn" (click)="openCartModal = true" [attr.aria-label]="'Warenkorb'">
        🛒
        <span class="cart-badge" *ngIf="cartCount() > 0">{{ cartCount() }}</span>
      </button>
      <!-- Desktop: Show Login or Logout -->
      <a *ngIf="!currentUser" routerLink="/login" class="btn btn-login">Login</a>
      <button *ngIf="currentUser" class="btn btn-logout" (click)="logout()">Logout</button>
    </div>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<!-- Cart Modal (Mobile) - Right Sidebar -->
<div *ngIf="openCartModal" class="cart-modal-overlay" (click)="openCartModal = false">
  <div class="cart-modal-content" [class.open]="openCartModal" (click)="$event.stopPropagation()">
    <div class="cart-modal-header">
      <h2>Warenkorb</h2>
      <button class="close-btn" (click)="openCartModal = false">&times;</button>
    </div>
    <div class="cart-modal-body">
      <app-cart (cartUpdated)="closeCart()"></app-cart>
    </div>
  </div>
</div>

<!-- Cart Sidebar (Desktop) -->
<div *ngIf="openCartModal" class="cart-sidebar-overlay" (click)="openCartModal = false"></div>
<div *ngIf="openCartModal" class="cart-sidebar open">
  <div class="cart-sidebar-header">
    <h2>Warenkorb</h2>
    <button class="close-btn" (click)="openCartModal = false">&times;</button>
  </div>
  <div class="cart-sidebar-body">
    <app-cart (cartUpdated)="closeCart()"></app-cart>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <p>&copy; 2024 DigiSpots. All rights reserved.</p>
  </div>
</footer>
