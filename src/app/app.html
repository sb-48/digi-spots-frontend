<header class="header">
  <div class="container">
    <a routerLink="/" class="logo">DigiSpots</a>
    
    <!-- Navigation (Desktop) -->
    <nav class="nav">
      <a routerLink="/locations" class="nav-link" routerLinkActive="active">Locations</a>
      <a routerLink="/energieoptimizer" class="nav-link" routerLinkActive="active">EnergieOptimizer</a>
      <a routerLink="/werbespots" class="nav-link" routerLinkActive="active">Werbespots</a>
      <a routerLink="/about" class="nav-link" routerLinkActive="active">Über uns</a>
      <a routerLink="/my-bookings" class="nav-link" routerLinkActive="active" *ngIf="currentUser">Meine Buchungen</a>
    </nav>
    
    <div class="header-right">
      <button class="cart-btn" (click)="openCartModal = true" [attr.aria-label]="'Warenkorb'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 3H5L5.4 5M7 13H17L21 5H5.4M7 13L5.4 5M7 13L4.7 15.3C4.3 15.7 4.6 16.5 5.1 16.5H17M17 13V17C17 18.1 17.9 19 19 19C20.1 19 21 18.1 21 17V13M9 19.5C9.8 19.5 10.5 20.2 10.5 21C10.5 21.8 9.8 22.5 9 22.5C8.2 22.5 7.5 21.8 7.5 21C7.5 20.2 8.2 19.5 9 19.5ZM20 19.5C20.8 19.5 21.5 20.2 21.5 21C21.5 21.8 20.8 22.5 20 22.5C19.2 22.5 18.5 21.8 18.5 21C18.5 20.2 19.2 19.5 20 19.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="cart-badge" *ngIf="cartCount() > 0">{{ cartCount() }}</span>
      </button>
      
      <!-- Mobile Menu Button -->
      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <!-- Desktop: Show Login only -->
      <a *ngIf="!currentUser" routerLink="/login" class="btn btn-login">Login</a>
    </div>

    <!-- Mobile Navigation -->
    <nav class="nav-mobile" [class.menu-open]="isMenuOpen()">
      <button class="menu-close" (click)="closeMenu()" aria-label="Close menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <a routerLink="/locations" class="nav-link" routerLinkActive="active" (click)="closeMenu()">Locations</a>
      <a routerLink="/energieoptimizer" class="nav-link" routerLinkActive="active" (click)="closeMenu()">EnergieOptimizer</a>
      <a routerLink="/werbespots" class="nav-link" routerLinkActive="active" (click)="closeMenu()">Werbespots</a>
      <a routerLink="/about" class="nav-link" routerLinkActive="active" (click)="closeMenu()">Über uns</a>
      <a routerLink="/my-bookings" class="nav-link" routerLinkActive="active" *ngIf="currentUser" (click)="closeMenu()">Meine Buchungen</a>
      
      <!-- Logout button in burger menu (mobile/tablet only) -->
      <button *ngIf="currentUser" class="btn btn-logout-mobile" (click)="logout(); closeMenu()">
        Logout
      </button>
    </nav>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<!-- Cart Modal (Mobile) - Right Sidebar -->
<div *ngIf="openCartModal" class="cart-modal-overlay" (click)="openCartModal = false">
  <div class="cart-modal-content" [class.open]="openCartModal" (click)="$event.stopPropagation()">
    <div class="cart-modal-header">
      <h2>Warenkorb</h2>
      <button class="close-btn" (click)="openCartModal = false">&times;</button>
    </div>
    <div class="cart-modal-body">
      <app-cart (cartUpdated)="closeCart()"></app-cart>
    </div>
  </div>
</div>

<!-- Cart Sidebar (Desktop) -->
<div *ngIf="openCartModal" class="cart-sidebar-overlay" (click)="openCartModal = false"></div>
<div *ngIf="openCartModal" class="cart-sidebar open">
  <div class="cart-sidebar-header">
    <h2>Warenkorb</h2>
    <button class="close-btn" (click)="openCartModal = false">&times;</button>
  </div>
  <div class="cart-sidebar-body">
    <app-cart (cartUpdated)="closeCart()"></app-cart>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <p>&copy; 2024 DigiSpots. All rights reserved.</p>
  </div>
</footer>
